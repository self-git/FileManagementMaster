name: Desktop installer acceptance

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundle: dmg
            installer: '*.dmg'
          - os: windows-2025
            bundle: nsis
            installer: '*setup.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Verify source runtime
        run: npm run git:verify
      - name: Build desktop installer
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: npm run desktop:build -- --bundles ${{ matrix.bundle }}
      - name: Keep installer for native acceptance
        uses: actions/upload-artifact@v4
        with:
          name: FileManagementMaster-${{ matrix.os }}
          path: src-tauri/target/release/bundle/${{ matrix.bundle }}/${{ matrix.installer }}
          if-no-files-found: error
      - name: Verify app installed from macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          images=(src-tauri/target/release/bundle/dmg/*.dmg)
          test "${#images[@]}" -eq 1
          mount_dir="$RUNNER_TEMP/FileManagementMaster-volume"
          install_dir="$RUNNER_TEMP/FileManagementMaster install"
          mkdir -p "$mount_dir" "$install_dir"
          hdiutil verify "${images[0]}"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "${images[0]}"
          trap 'hdiutil detach "$mount_dir"' EXIT
          installed="$install_dir/FileManagementMaster.app"
          ditto "$mount_dir/FileManagementMaster.app" "$installed"
          hdiutil detach "$mount_dir"
          trap - EXIT
          codesign --verify --deep --strict "$installed"
          export FILEMANAGEMENT_BUNDLED_GIT_DIR="$installed/Contents/Resources/git"
          export FILEMANAGEMENT_GC_WORKER="$installed/Contents/MacOS/filemanagement-master"
          cargo test --locked --manifest-path src-tauri/Cargo.toml --tests -- --nocapture
      - name: Verify Git from installed Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer missing' }
          $installDir = Join-Path $env:RUNNER_TEMP 'FileManagementMaster-install'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          $env:FILEMANAGEMENT_BUNDLED_GIT_DIR = Join-Path $installDir 'git'
          $env:FILEMANAGEMENT_GC_WORKER = Join-Path $installDir 'filemanagement-master.exe'
          cargo test --locked --manifest-path src-tauri/Cargo.toml --tests -- --nocapture
